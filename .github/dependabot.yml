version: 2
updates:
  # GitHub Actions: every workflow pins its actions by commit SHA. Dependabot supports SHA-pinned actions directly: it opens a PR
  # updating the pinned SHA, never switching to a floating tag. See
  # docs/adr/0009-repository-governance-baseline.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Single-maintainer repository with exactly one workflow and one
    # pinned action today - grouping every github-actions update into
    # one PR avoids multiple near-duplicate PRs for what will usually
    # be a single-line SHA bump.
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # Phase 5.1a: the first-party image. Base images are pinned by digest
  # (check-supply-chain enforces it); Dependabot proposes digest bumps,
  # each one rebuilt and rescanned by .github/workflows/image.yml.
  - package-ecosystem: "docker"
    directory: "/apps/smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Phase 5.1a: apps/smoke uses only the standard library today; this
  # keeps the go directive and any future module current.
  - package-ecosystem: "gomod"
    directory: "/apps/smoke"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
