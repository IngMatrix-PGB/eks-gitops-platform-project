name: promotion

# Phase 5.1c-1 (ADR-0017): on every PR that changes an environment's
# image or the promotion ledger, verify online that each image of our
# repository the overlays point at was signed by the main image workflow
# and carries a CycloneDX SBOM attestation per platform. The offline
# rules (order dev <- main, uat <- dev, prod <- uat; local/aws overlays
# agree; append-only ledger) run in validate.yml through make validate.
# Read-only token; the only action is GitHub-owned and SHA-pinned.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Phase 5.3a (ADR-0020): this workflow runs on every pull request so
    # its check can be required on main; this job says whether the change
    # touches the paths below. Same list as `on.push.paths` where there is
    # one (check-repo-governance compares them).
    name: promotion paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, the same pin as validate.yml. Full
        # history so the pull request's merge base is present.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Paths this workflow covers
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bash scripts/ci/changed-paths.sh \
            'charts/standard-workload/values-*.yaml' \
            'charts/postgres-lab/values-*.yaml' \
            'gitops/bootstrap/values.yaml' \
            'gitops/promotions/**' \
            'scripts/promote/**' \
            '.github/workflows/promotion.yml' \
            'scripts/ci/changed-paths.sh'

  verify:
    name: verify promoted images
    needs: changes
    # Skipped (which a required check counts as passed) only when the
    # paths job answered exactly "false"; if it failed or gave no answer,
    # this job runs.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, the same pin as validate.yml.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: make tools-install
        run: make tools-install

      - name: make promotion-verify
        run: make promotion-verify
