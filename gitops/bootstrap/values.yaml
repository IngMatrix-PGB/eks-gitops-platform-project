# gitops/bootstrap/values.yaml — Phase 2.3 explicit contract.
# repoURL/gitRevision are overridden by the root Application's own Helm
# parameters (see gitops/root-application.yaml) so every generated
# Application reads from the exact same repository and revision as the
# root Application itself - never a second, independently-drifting copy.

repoURL: git@github.com:IngMatrix-PGB/eks-gitops-platform-project.git
gitRevision: main

project:
  name: platform

# Phase 2.4: both environments render the same chart (the standard
# workload contract) - only the environment name/namespace and the
# per-environment values file differ. A single constant path, not a
# per-environment one, is therefore the correct shape now.
workloadChartPath: charts/standard-workload

# Exactly three environments, matching the dev/uat/prod spokes of
# ADR-0015 (simulated as namespaces in lab-lite). Adding a fourth is
# intentionally not supported without an explicit, separately-reviewed
# change - lab/gitops/render.sh asserts exactly these three.
environments:
  - name: dev
    namespace: dev
  - name: uat
    namespace: uat
  - name: prod
    namespace: prod

# Phase 3.3.4a: which environment list templates/applicationset.yaml's
# generator uses. Defaults to "local-kind" - reproduces the render
# above exactly, byte-for-byte, since every existing invocation
# (`make gitops-render`/`make gitops-bootstrap`, no override) omits
# this key and inherits this default via Helm's normal values merge.
# "local-multicluster" and "aws-eks" (Phase 3.4.4b, DESIGNED / NOT
# DEPLOYED) switch to the hub-and-spoke clusters generator with the
# `multicluster` or `awsEks` contract below. Any other value fails the
# render closed (templates/applicationset.yaml).
profile: "local-kind"

# Phase 3.4.4b (ADR-0015/0016): profile "aws-eks" is hub-and-spoke - the
# hub's Argo CD (platform account) deploys to one EKS cluster per
# environment through the same clusters generator as local-multicluster,
# never in-cluster. A spoke is selected only by a cluster Secret rendered
# by lab/eks/spoke-cluster-secret.sh (same labels as below; checked by
# tests/eks/test-spoke-cluster-secret.sh). The owner label value differs
# from the lab's, so a lab spoke Secret can never be selected here and
# vice versa. Namespaces are dev/uat/prod (one cluster per environment, no
# collision); the overlays stay values-<env>-aws.yaml.
awsEks:
  ownerLabelKey: eks-gitops-lab-lite.local/owner
  ownerLabelValue: eks-spoke-registration
  environmentLabelKey: platform.environment
  clusterNamePrefix: spoke-
  overlaySuffix: "-aws"
  environments:
    - dev
    - uat
    - prod

# Phase 2.7.4 (ADR-0015): profile "local-multicluster" - the hub's Argo
# CD deploys to the kind spokes registered by lab/multicluster/spoke-
# register.sh (Phase 2.7.3), through a `clusters` generator instead of
# the list above. A spoke is selected only when its hub cluster Secret
# carries BOTH the registration owner label and a platform.environment
# label whose value is in `environments` below - this list is the
# selector's only source, so a fourth environment (or a hand-made
# Secret labelled e.g. "qa") can never produce an Application. The
# destination is the cluster NAME (spoke-<env>), never the hub's
# in-cluster server. Must match lab/multicluster/_lib.sh.
multicluster:
  ownerLabelKey: eks-gitops-lab-lite.local/owner
  ownerLabelValue: multicluster-registration
  environmentLabelKey: platform.environment
  clusterNamePrefix: spoke-
  environments:
    - dev
    - uat
    - prod
