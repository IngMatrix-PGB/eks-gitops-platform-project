{{- /*
This ApplicationSet's own spec.template block uses ApplicationSet's Go
templating (goTemplate: true), which is evaluated later by the live
ApplicationSet controller - NOT by `helm template` now. Every
{{ "{{" }}.field{{ "}}" }} occurrence below is deliberately built from
literal Helm string pieces so Helm passes it through untouched instead
of trying to resolve .field as a Helm value.
*/ -}}
{{- /*
Phase 2.7.4: the generator's element fields differ per profile - the
list generator exposes .env/.namespace directly; the clusters generator
(local-multicluster) exposes them as .values.env, set from the spoke's
platform.environment label (the namespace equals the environment name
on a spoke, by spoke-register.sh's contract). These Helm variables hold
the literal ApplicationSet expressions; for local-kind/aws-eks they
produce exactly the same strings as before.
*/ -}}
{{- /*
Phase 3.4.4b: aws-eks is hub-and-spoke too (ADR-0015/0016) - it shares
the clusters-generator branch with local-multicluster. $hs holds the
active profile's spoke contract (selector labels, environments, cluster
name prefix, overlay suffix); the two profiles differ only in data.
*/ -}}
{{- if not (has .Values.profile (list "local-kind" "local-multicluster" "aws-eks")) }}
{{- fail (printf "gitops/bootstrap: unknown profile %q - must be exactly \"local-kind\", \"aws-eks\" or \"local-multicluster\"" .Values.profile) }}
{{- end }}
{{- $envRef := printf "%s.env%s" "{{" "}}" }}
{{- $nsRef := printf "%s.namespace%s" "{{" "}}" }}
{{- $multicluster := has .Values.profile (list "local-multicluster" "aws-eks") }}
{{- $hs := dict }}
{{- $overlaySuffix := "" }}
{{- if $multicluster }}
{{- $hs = ternary .Values.awsEks .Values.multicluster (eq .Values.profile "aws-eks") }}
{{- $overlaySuffix = $hs.overlaySuffix | default "" }}
{{- $envRef = printf "%s.values.env%s" "{{" "}}" }}
{{- $nsRef = $envRef }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ .Values.project.name }}-environments
  namespace: argocd
  labels:
    eks-gitops-lab-lite.local/owner: gitops-bootstrap
  annotations:
    # Higher wave than the AppProject (wave "0") - deleted FIRST on
    # cascade (reverse wave order), so this ApplicationSet and its
    # generated Applications finish their own finalizer-driven cleanup
    # while the AppProject they reference still exists. See the
    # AppProject template for the full rationale.
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  # Phase 2.6.3a: lets lab/gitops/retire-appproject-kind.sh safely pause
  # automated sync (a live patch to spec.syncPolicy.automated on one
  # generated Application) without this ApplicationSet's own reconcile
  # loop reverting it moments later - confirmed empirically it
  # otherwise does, roughly every 30-45s ("updated Application" in the
  # argocd-applicationset-controller's own logs, followed by "Enabled
  # automated sync" in the application-controller's). Never changes
  # the rendered DEFAULT below (still selfHeal:true, prune:true for a
  # normal apply) - only tells this ApplicationSet to stop re-asserting
  # that one field once an operational script has intentionally
  # changed it live. See
  # .local/evidence/phase-2.6.3-gitops-lifecycle-hardening-plan.md,
  # Gap 3.
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy/automated
  generators:
    {{- if $multicluster }}
    {{- /*
    Phase 2.7.4: one Application per registered spoke. The hub itself
    (in-cluster) has no cluster Secret carrying these labels, so it is
    never selected. matchLabels and matchExpressions are ANDed.
    */}}
    - clusters:
        selector:
          matchLabels:
            {{ $hs.ownerLabelKey }}: {{ $hs.ownerLabelValue }}
          matchExpressions:
            - key: {{ $hs.environmentLabelKey }}
              operator: In
              values:
                {{- range $hs.environments }}
                - {{ . }}
                {{- end }}
        values:
          env: '{{ "{{" }}index .metadata.labels "{{ $hs.environmentLabelKey }}"{{ "}}" }}'
    {{- else }}
    - list:
        elements:
          {{- /*
          local-kind only (Phase 3.4.4b): aws-eks moved to the clusters
          generator above. The profile is validated at the top of this
          file - an unknown value fails the render closed, never a
          silent fallback.
          */}}
          {{- range .Values.environments }}
          - env: {{ .name }}
            namespace: {{ .namespace }}
          {{- end }}
    {{- end }}
  template:
    metadata:
      name: "platform-smoke-{{ $envRef }}"
      labels:
        eks-gitops-lab-lite.local/owner: gitops-bootstrap
      # Required so deleting this Application (directly, or via cascade
      # when the ApplicationSet/root Application above it is deleted)
      # also deletes the Deployment/Service/ServiceAccount/ConfigMap it
      # manages, instead of orphaning them.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: {{ .Values.project.name }}
      source:
        repoURL: {{ .Values.repoURL }}
        targetRevision: {{ .Values.gitRevision }}
        path: {{ .Values.workloadChartPath }}
        helm:
          valueFiles:
            - "values-{{ $envRef }}{{ $overlaySuffix }}.yaml"
      # Phase 2.8.2: an HPA owns spec.replicas of a Deployment the workload
      # chart annotates replicas-owner=hpa (the chart renders minReplicas
      # there). Only those: a static Deployment stays fully reconciled
      # from Git. ignoreDifferences hides the HPA's changes from the diff,
      # and RespectIgnoreDifferences (syncOptions below) makes every sync
      # send the live value instead of the chart's, so Argo CD keeps the
      # field (never dropped to the API default of 1) without resetting it.
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - 'select(.metadata.annotations["eks-gitops-lab-lite.local/replicas-owner"] == "hpa") | .spec.replicas'
      destination:
        {{- if $multicluster }}
        name: "{{ "{{" }}.name{{ "}}" }}"
        {{- else }}
        server: https://kubernetes.default.svc
        {{- end }}
        namespace: "{{ $nsRef }}"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          {{- if $multicluster }}
          {{- /*
          Phase 2.7.4: the spoke credential (Phase 2.7.3) has
          clusterResources=false and no Namespace permission by design;
          spoke-register.sh creates the workload namespace with the same
          Pod Security labels managedNamespaceMetadata sets below.
          */}}
          - CreateNamespace=false
          {{- else }}
          - CreateNamespace=true
          {{- end }}
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          # Graduated safety step (official Argo CD sync-options
          # mechanism): defers pruning of anything removed from the
          # desired state to the final sync wave, letting the rest of
          # the sync fully settle first. Not Prune=confirm - nothing
          # this chart renders is stateful/irreversible-if-pruned, so a
          # manual confirmation gate would only block routine automated
          # updates for no safety benefit (ADR-0008 / Phase 2.4 plan).
          - PruneLast=true
        {{- if not $multicluster }}
        managedNamespaceMetadata:
          labels:
            eks-gitops-lab-lite.local/owner: gitops-bootstrap
            # Pod Security Admission, pinned to this project's own
            # cluster minor version (kindest/node:v1.36.4). Enforced by
            # the API server at admission time, not merely documented.
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: v1.36
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: v1.36
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: v1.36
        {{- end }}
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
