apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: argocd
  labels:
    eks-gitops-lab-lite.local/owner: gitops-bootstrap
  annotations:
    # Sync waves order deletion in REVERSE - wave "0" is deleted last,
    # after wave "1" (the ApplicationSet). Without this, the root
    # Application's finalizer deletes both with no ordering guarantee;
    # observed empirically to sometimes delete this AppProject first,
    # leaving the ApplicationSet's still-existing generated Applications
    # unable to resolve their project reference until a slow
    # informer-resync retry eventually clears it. This makes the
    # correct order deterministic instead of racing on resync timing.
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: >-
    Phase 2.6.2 platform environments. Exact-scoped: one source repo,
    dev/uat/prod destinations only, one minimal cluster grant
    (Namespace), exactly the 9 kinds the workload chart renders.
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    {{- if has .Values.profile (list "local-multicluster" "aws-eks") }}
    {{- /*
    Phase 2.7.4 / 3.4.4b: spokes only, by cluster name - never the hub's
    in-cluster server, so not even a hand-made Application in this
    project can land on the hub. aws-eks uses the same names
    (spoke-<env>); the real EKS cluster name lives only in the cluster
    Secret's awsAuthConfig.clusterName (lab/eks/spoke-cluster-secret.sh).
    */}}
    {{- $hs := ternary .Values.awsEks .Values.multicluster (eq .Values.profile "aws-eks") }}
    {{- range $hs.environments }}
    - name: {{ $hs.clusterNamePrefix }}{{ . }}
      namespace: {{ . }}
    {{- end }}
    {{- else }}
    {{- range .Values.environments }}
    - server: https://kubernetes.default.svc
      namespace: {{ .namespace }}
    {{- end }}
    {{- end }}
  # Proven necessary empirically during this phase's lifecycle test, not
  # assumed: an empty clusterResourceWhitelist makes every generated
  # Application's CreateNamespace=true sync fail with "resource
  # :Namespace is not permitted in project platform" - the sync option
  # IS subject to normal AppProject cluster-resource enforcement, it is
  # not a permission-check-exempt controller step. This is the single
  # minimum grant that makes it work; see docs/adr/0007-private-gitops-
  # bootstrap.md for the empirical finding.
  {{- if has .Values.profile (list "local-multicluster" "aws-eks") }}
  {{- /* Phase 3.4.4b: aws-eks too - the spoke bootstrap creates the namespace. */}}
  # Phase 2.7.4: nothing cluster-scoped - CreateNamespace=false on spokes.
  clusterResourceWhitelist: []
  {{- else }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  {{- end }}
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: "apps"
      kind: Deployment
    # Phase 2.6.2: exactly the two namespaced kinds the workload chart's
    # new templates/secretstore.yaml and templates/externalsecret.yaml
    # render. Never Secret - the generated target Secret is created by
    # ESO directly, never by any chart template Argo CD applies, so
    # Argo CD is never granted permission to manage a Secret.
    - group: "external-secrets.io"
      kind: SecretStore
    - group: "external-secrets.io"
      kind: ExternalSecret
    # Phase 2.8.1: exactly the two resilience kinds the workload chart
    # now renders (PodDisruptionBudget only where replicaCount >= 2).
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    # Phase 2.8.2: the workload chart's optional HPA (prod only today).
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
