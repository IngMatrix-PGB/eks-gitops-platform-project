apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: argocd
  labels:
    eks-gitops-lab-lite.local/owner: gitops-bootstrap
  annotations:
    # Sync waves order deletion in REVERSE - wave "0" is deleted last,
    # after wave "1" (the ApplicationSet). Without this, the root
    # Application's finalizer deletes both with no ordering guarantee;
    # observed empirically to sometimes delete this AppProject first,
    # leaving the ApplicationSet's still-existing generated Applications
    # unable to resolve their project reference until a slow
    # informer-resync retry eventually clears it. This makes the
    # correct order deterministic instead of racing on resync timing.
    argocd.argoproj.io/sync-wave: "0"
spec:
  description: >-
    Phase 2.6.2 platform environments. Exact-scoped: one source repo,
    staging/production destinations only, one minimal cluster grant
    (Namespace), exactly the 6 kinds the workload chart renders.
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    {{- range .Values.environments }}
    - server: https://kubernetes.default.svc
      namespace: {{ .namespace }}
    {{- end }}
    {{- /*
    Phase 3.3.4a: always whitelisted, even though templates/
    applicationset.yaml's generator only ever emits one profile's
    Applications at a time (never both) - an AppProject destination
    whitelist is a static allow-list, not a profile-gated one, and
    listing these here does not by itself create the staging-aws/
    production-aws namespaces (CreateNamespace=true only fires for an
    Application the ApplicationSet actually generates). DESIGNED / NOT
    DEPLOYED - see .local/evidence/phase-3.3.4-aws-application-
    bootstrap-addendum.md.
    */}}
    {{- range .Values.awsEnvironments }}
    - server: https://kubernetes.default.svc
      namespace: {{ .namespace }}
    {{- end }}
  # Proven necessary empirically during this phase's lifecycle test, not
  # assumed: an empty clusterResourceWhitelist makes every generated
  # Application's CreateNamespace=true sync fail with "resource
  # :Namespace is not permitted in project platform" - the sync option
  # IS subject to normal AppProject cluster-resource enforcement, it is
  # not a permission-check-exempt controller step. This is the single
  # minimum grant that makes it work; see docs/adr/0007-private-gitops-
  # bootstrap.md for the empirical finding.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: "apps"
      kind: Deployment
    # Phase 2.6.2: exactly the two namespaced kinds the workload chart's
    # new templates/secretstore.yaml and templates/externalsecret.yaml
    # render. Never Secret - the generated target Secret is created by
    # ESO directly, never by any chart template Argo CD applies, so
    # Argo CD is never granted permission to manage a Secret.
    - group: "external-secrets.io"
      kind: SecretStore
    - group: "external-secrets.io"
      kind: ExternalSecret
