# lab/argocd/values-lab.yaml — Phase 2.2 explicit security/topology contract.
# Every key is an explicit override or a deliberately-confirmed default;
# see docs/architecture/technical-architecture.md for the per-key chart
# citation. No key here is "left at chart default" without that citation
# existing in the TAD.

dex:
  enabled: false

notifications:
  enabled: false

global:
  image:
    repository: quay.io/argoproj/argocd
    tag: "v3.5.2@sha256:e2aadfae709d904e87f46ba4aa49601d827b3022db22cd4d03aae816a2e7097b"

controller:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

repoServer:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

applicationSet:
  replicas: 1
  ingress:
    enabled: false
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

redisSecretInit:
  # Enabled by chart default (not overridden); its pre-install/pre-upgrade
  # hook Job runs the "secret-init" container and needs its own governance.
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

redis:
  enabled: true
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  image:
    tag: "8.6.4-alpine@sha256:2cc044fc5a07c9b701f8f1255a309ae9ad7856e694ac03513bf3648c01e40763"

redis-ha:
  enabled: false

crds:
  install: true
  keep: true

configs:
  cm:
    # Phase 4b (ADR-0025): the local admin is break-glass only. It stays
    # off here; `make argocd-breakglass` turns it on for a time, with a
    # reason and an alert, and `make argocd-breakglass-off` turns it off.
    admin.enabled: false
    users.anonymous.enabled: "false"   # chart's own key type: quoted string, not YAML boolean
    # The address people open (make argocd-port-forward); the SSO
    # redirect is <url>/auth/callback, the one the realm's argocd client
    # allows.
    url: https://localhost:8443
    # Direct OIDC to the lab's Keycloak on the hub (ADR-0005: no Dex).
    # The client secret is read from the Secret argocd-oidc, which
    # `make idp-install` writes; it is never in Git. On a cluster with no
    # Keycloak (lab-lite, the EKS session) SSO login fails and access is
    # through kubectl or break-glass.
    oidc.config: |
      name: Keycloak
      issuer: http://keycloak.keycloak.svc.cluster.local:8080/realms/platform
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes: ["openid", "profile", "email"]
    # Phase 2.7.3 (ADR-0015, plan D1): which resource kinds Argo CD's
    # cluster cache watches. In-cluster (lab-lite, and the hub's own
    # argocd namespace) stays unrestricted - identical to the chart
    # default. Remote spokes are limited to exactly the kinds their
    # namespace-scoped credential may manage: proven empirically that,
    # without this, the cache tries to list every namespaced kind
    # (Pods first, Secrets too) and fails cluster sync under a
    # credential that deliberately cannot read them.
    resource.inclusions: |
      - apiGroups: ["*"]
        kinds: ["*"]
        clusters: ["https://kubernetes.default.svc"]
      - apiGroups: [""]
        kinds: ["ConfigMap", "Service", "ServiceAccount", "PersistentVolumeClaim"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      - apiGroups: ["external-secrets.io"]
        kinds: ["SecretStore", "ExternalSecret"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      # Phase 2.8.1: the two resilience kinds the workload chart renders.
      - apiGroups: ["policy"]
        kinds: ["PodDisruptionBudget"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      - apiGroups: ["networking.k8s.io"]
        kinds: ["NetworkPolicy"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      # Phase 2.8.2: the workload chart's optional HPA.
      - apiGroups: ["autoscaling"]
        kinds: ["HorizontalPodAutoscaler"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
      # Phase 6.3a: stateful components and their dump Jobs (ADR-0023).
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
        clusters: ["https://eks-gitops-*-control-plane:6443"]
  # Phase 4b: roles come from the token's flat `groups` claim. A signed-in
  # user with no group gets nothing (policy.default empty). Developers
  # see, sync and read logs of their own environment's Applications only.
  rbac:
    policy.default: ""
    scopes: "[groups]"
    policy.matchMode: glob
    policy.csv: |
      g, platform-admins, role:admin
      g, auditors, role:readonly
      p, role:developer-dev, applications, get, platform/platform-*-dev, allow
      p, role:developer-dev, applications, sync, platform/platform-*-dev, allow
      p, role:developer-dev, logs, get, platform/platform-*-dev, allow
      p, role:developer-dev, projects, get, platform, allow
      g, developers-dev, role:developer-dev
      p, role:developer-uat, applications, get, platform/platform-*-uat, allow
      p, role:developer-uat, applications, sync, platform/platform-*-uat, allow
      p, role:developer-uat, logs, get, platform/platform-*-uat, allow
      p, role:developer-uat, projects, get, platform, allow
      g, developers-uat, role:developer-uat
  params:
    server.insecure: "false"            # same: quoted string, per argocd-cmd-params-cm.yaml
