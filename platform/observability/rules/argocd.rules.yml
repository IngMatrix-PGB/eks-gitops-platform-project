# Phase 6.1c (ADR-0021): Argo CD health alerts, from the hub's own
# application controller metrics (argocd_app_info, argocd_app_sync_total,
# up). Grouped by application (name) and destination cluster
# (dest_server).
groups:
  - name: argocd-health
    rules:
      - alert: ArgoCDApplicationDegraded
        expr: max by (name, project, dest_server) (argocd_app_info{health_status="Degraded"}) == 1
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Argo CD application {{ $labels.name }} has been Degraded for 10 minutes"
          description: "Destination {{ $labels.dest_server }}, project {{ $labels.project }}."

      - alert: ArgoCDApplicationOutOfSync
        expr: max by (name, project, dest_server) (argocd_app_info{sync_status="OutOfSync"}) == 1
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: "Argo CD application {{ $labels.name }} has been OutOfSync for 30 minutes"
          description: "Destination {{ $labels.dest_server }}, project {{ $labels.project }}. Git and the cluster differ and automated sync has not closed the gap."

      # A lost spoke connection (an expired lab token, a stopped spoke, a
      # revoked credential): Argo CD reconciles nothing there. Measured on
      # 2026-11-25: both lab tokens expired, connection_status went 0 and
      # six Applications Unknown, with no alert for two hours.
      - alert: ArgoCDClusterUnreachable
        expr: max by (server) (argocd_cluster_connection_status) == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Argo CD cannot reach cluster {{ $labels.server }}"
          description: "Argo CD has had no working connection to {{ $labels.server }} for 5 minutes, so nothing there is reconciled. In the lab, run make mc-spoke-rotate first (an expired spoke token); then make lab-mc-status."

      - alert: ArgoCDApplicationUnknown
        expr: max by (name, project, dest_server) (argocd_app_info{sync_status="Unknown"}) == 1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Argo CD application {{ $labels.name }} has had an Unknown sync status for 15 minutes"
          description: "Destination {{ $labels.dest_server }}, project {{ $labels.project }}. Argo CD cannot compare Git with the cluster; check its conditions (a ComparisonError usually means a lost cluster connection)."

      - alert: ArgoCDApplicationSyncFailed
        expr: sum by (name, project, dest_server) (increase(argocd_app_sync_total{phase=~"Error|Failed"}[10m])) > 0
        labels:
          severity: ticket
        annotations:
          summary: "Argo CD failed to sync application {{ $labels.name }}"
          description: "{{ $value }} failed sync operation(s) in the last 10 minutes; destination {{ $labels.dest_server }}."

      - alert: ArgoCDApplicationControllerDown
        expr: |
          up{job="argocd-application-controller"} == 0
          or
          absent(up{job="argocd-application-controller"})
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The hub's Argo CD application controller has not been scraped for 5 minutes"
          description: "No application is reconciled while it is down, and the other Argo CD alerts go blind."

  # Phase 4b (ADR-0025): the local admin is break-glass only. Every
  # successful local login (session Create, which SSO never uses) pages,
  # and a server that cannot be scraped would hide one.
  - name: argocd-access
    rules:
      - alert: ArgoCDLocalAdminLogin
        expr: sum by (cluster) (increase(grpc_server_handled_total{job="argocd-server",grpc_service="session.SessionService",grpc_method="Create",grpc_code="OK"}[10m])) > 0
        labels:
          severity: page
        annotations:
          summary: "Someone signed in to Argo CD with the local admin (break-glass)"
          description: "{{ $value }} local login(s) in the last 10 minutes on cluster {{ $labels.cluster }}. Check the break-glass record: make argocd-breakglass-status."

      - alert: ArgoCDServerDown
        expr: |
          up{job="argocd-server"} == 0
          or
          absent(up{job="argocd-server"})
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The hub's Argo CD API server has not been scraped for 5 minutes"
          description: "A break-glass login would not raise ArgoCDLocalAdminLogin while it is down."
