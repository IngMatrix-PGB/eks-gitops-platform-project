# Phase 6.3c (ADR-0023): the reference application's PostgreSQL in dev.
# Rendered by Application platform-postgres-dev (release name), so its
# Service is platform-postgres-dev. The image is the chart's digest; the
# passwords come from eso-source-dev/db-dev (make eso-provision-db-secret
# ENV=dev), read by this chart's own SecretStore identity.
credentials:
  secretStoreName: dev-postgres-backend
  authServiceAccountName: dev-postgres-reader
  sourceNamespace: eso-source-dev
  sourceSecretName: db-dev

# Only notes connects (Application platform-notes-dev).
networkPolicy:
  clientPodLabels:
    app.kubernetes.io/instance: platform-notes-dev
