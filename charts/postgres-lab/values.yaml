# Phase 6.3b (ADR-0023): every key is required by values.schema.json and
# set here or by the environment overlay. No password is ever a value:
# both passwords come from the ESO-built Secret (credentials.*).

image:
  repository: docker.io/library/postgres
  # postgres:18.6-bookworm, multi-arch index digest.
  digest: "sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5"

# The database the application owns, and its login role (not a
# superuser). Created on first start only (empty data directory).
database: notes
appUser: notes

storage:
  size: 1Gi
  # Empty: the cluster's default StorageClass (local-path in kind).
  storageClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# The source Secret (imperative, outside Git - lab/eso/provision-db-
# secret.sh) holds two keys, superuser-password and app-password. This
# chart's SecretStore reads it through its own ServiceAccount.
credentials:
  secretStoreName: ""
  authServiceAccountName: ""
  sourceNamespace: ""
  sourceSecretName: ""
  refreshInterval: "1m"

# Pods allowed to connect on 5432 (same namespace), by label.
networkPolicy:
  clientPodLabels: {}

# Phase 6.3d (ADR-0022 amendment): logical dumps of the application's
# database to the lab object store, every 6 h, kept 72 h (the same cadence
# and TTL as Velero). A CronJob: pg_dump as the application role (the data
# owner, not a superuser), then rclone uploads the dump and its SHA-256 to
# bucket dumps-<env> and deletes objects older than `keep`. The store key
# comes from eso-source-<env>/dumps-<env> (make db-dump-key ENV=<env>),
# through this chart's SecretStore, as files.
dump:
  enabled: true
  schedule: "17 */6 * * *"
  keep: "72h"
  # rclone v1.76.0, multi-arch index digest. Pinned 13 days after
  # release (one day short of the two-week rule) because v1.75.2 carries
  # six fixable HIGH findings and v1.76.0 one (Go stdlib); recorded in
  # ADR-0022.
  image:
    repository: docker.io/rclone/rclone
    digest: "sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466"
  # The lab store (versitygw) by its container name on the kind network,
  # and that network's CIDR for the egress rule: the container's address
  # can change when it is recreated, the network's range does not.
  # `make db-dump-key` checks the store's address is inside it.
  storeEndpoint: "http://eks-gitops-backup-store:7070"
  storeCIDR: "172.20.0.0/16"
  storePort: 7070
  # Source Secret (imperative, outside Git) with access-key-id and
  # secret-access-key; empty means dumps-<release namespace>.
  sourceSecretName: ""
  bucket: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
