# Phase 6.3c (ADR-0023): the reference application's PostgreSQL in uat.
# Rendered by Application platform-postgres-uat (release name), so its
# Service is platform-postgres-uat. The image is the chart's digest; the
# passwords come from eso-source-uat/db-uat (make eso-provision-db-secret
# ENV=uat), read by this chart's own SecretStore identity.
credentials:
  secretStoreName: uat-postgres-backend
  authServiceAccountName: uat-postgres-reader
  sourceNamespace: eso-source-uat
  sourceSecretName: db-uat

# Only notes connects (Application platform-notes-uat).
networkPolicy:
  clientPodLabels:
    app.kubernetes.io/instance: platform-notes-uat
