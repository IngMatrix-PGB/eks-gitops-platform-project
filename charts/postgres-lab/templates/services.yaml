apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "postgres-lab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "postgres-lab.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-headless
  labels:
    {{- include "postgres-lab.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "postgres-lab.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
