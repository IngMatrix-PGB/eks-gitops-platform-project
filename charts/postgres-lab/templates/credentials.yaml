{{- /*
Phase 6.3b (ADR-0023): the two passwords, only through ESO. The
SecretStore's Kubernetes provider reads the imperative source Secret in
credentials.sourceNamespace with its own ServiceAccount (no token
mounted anywhere); ESO writes the target Secret <release>-credentials,
which this chart never renders and Argo CD never manages.
*/ -}}
{{- $c := .Values.credentials }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.authServiceAccountName }}
  labels:
    {{- include "postgres-lab.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $c.secretStoreName }}
  labels:
    {{- include "postgres-lab.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $c.sourceNamespace }}
      server:
        url: "kubernetes.default"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $c.authServiceAccountName }}
          namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-credentials
  labels:
    {{- include "postgres-lab.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $c.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ $c.secretStoreName }}
  target:
    name: {{ .Release.Name }}-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: superuser-password
      remoteRef:
        key: {{ $c.sourceSecretName }}
        property: superuser-password
    - secretKey: app-password
      remoteRef:
        key: {{ $c.sourceSecretName }}
        property: app-password
