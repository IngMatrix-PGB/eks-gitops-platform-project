# Environment overrides for dev only (Phase 2.7.1, ADR-0015). dev is the
# spoke that reconciles every merge to main automatically; it carries
# the smallest footprint of the three. Everything not listed here is
# inherited from values.yaml.
# Phase 5.1c-1: this environment's image, changed only by `make promote`
# (scripts/promote/promote.sh). values-dev.yaml and values-dev-aws.yaml
# always hold the same reference; check-promotion enforces it.
image:
  repository: ghcr.io/ingmatrix-pgb/eks-gitops-platform-smoke
  digest: "sha256:146757533ef4f3fe2b003a888dfe70b9e5e616b1431aff37d2a17d2d3f1a7047"

replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

configMap:
  uiMessage: "platform smoke dev"

# Enables the read-only Secret mount for dev only - fully separate
# SecretStore/source-namespace/source-Secret/auth ServiceAccount from
# uat and prod, no shared object of any kind.
externalSecret:
  enabled: true
  secretStoreName: "dev-kubernetes-backend"
  sourceNamespace: "eso-source-dev"
  sourceSecretName: "local-backend-dev"
  authServiceAccountName: "dev-secretstore-reader"

# Phase 6.3c (ADR-0023): /api/notes forwards to notes in this namespace
# (Application platform-notes-dev), and only notes is reachable beyond DNS.
# Lab only: the aws overlay keeps notes off until 6.4.
extraEnv:
  NOTES_URL: http://platform-notes-dev-standard-workload:8080

networkPolicy:
  egressToPods:
    - podLabels:
        app.kubernetes.io/instance: platform-notes-dev
      port: 8080
