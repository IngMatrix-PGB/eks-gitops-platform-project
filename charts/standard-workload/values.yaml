# charts/standard-workload/values.yaml — Phase 2.4 explicit contract.
# Every key here is backed by a template that reads it (values.schema.json
# additionalProperties:false makes any unread key a hard validation error,
# not silent dead config). See docs/adr/0006-standard-workload-contract.md
# and docs/adr/0008-standard-workload-before-sso.md.

image:
  repository: ghcr.io/stefanprodan/podinfo
  digest: "sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"

replicaCount: 1
revisionHistoryLimit: 3
terminationGracePeriodSeconds: 30

strategy:
  type: RollingUpdate
  maxUnavailable: 0
  maxSurge: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

readinessProbe:
  path: /readyz
  periodSeconds: 5
  failureThreshold: 3

livenessProbe:
  path: /healthz
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  enabled: false
  path: /healthz
  periodSeconds: 5
  failureThreshold: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

serviceAccount:
  automountServiceAccountToken: false

service:
  port: 9898

volumes:
  dataEmptyDir: true
  tmpEmptyDir: true

configMap:
  uiMessage: "podinfo — override per environment"

# Phase 2.6.2: an externally-managed Secret this chart never creates,
# read-only-mounted for the workload to consume. Disabled by default -
# every environment that does not set externalSecret.enabled: true
# renders byte-identical output to before this block existed (see
# scripts/validate/check-standard-workload-chart.sh's golden-hash
# check). See docs/adr/0010-external-secrets-operator-contract.md and
# .local/evidence/phase-2.6-external-secrets-plan.md §10-11.
externalSecret:
  enabled: false
  # Phase 3.3.1: which SecretStore backend templates/secretstore.yaml
  # renders. Defaults to "kubernetes" - every existing environment
  # values file (values-uat.yaml/values-prod.yaml) omits this
  # key and inherits this default via Helm's normal values merge, so
  # their render is unaffected by this key's introduction. "aws" is the
  # future EKS Pod Identity / Secrets Manager backend (not deployed by
  # this phase - schema/template contract only, see
  # .local/evidence/phase-3.3-eks-gitops-eso-aws-integration-plan.md).
  provider: "kubernetes"
  # Name of the namespaced SecretStore this chart also renders
  # (templates/secretstore.yaml) when enabled.
  secretStoreName: ""
  # --- provider: kubernetes only. Left at these harmless defaults
  # (never touched by any "aws" profile values file) rather than
  # removed from this base file: values-uat.yaml/values-
  # prod.yaml already rely on inheriting sourceProperty's default
  # via Helm's normal deep-merge (they never set it themselves), so
  # this file's defaults cannot be deleted without changing their
  # render. values.schema.json's "aws" branch pins these same four
  # fields to exactly these defaults ("" / "message") - not forbidden
  # outright - so an "aws" profile values file harmlessly inherits them
  # unused, while any values file that actually SETS one of them to
  # something else under provider: aws is rejected as misplaced
  # kubernetes-provider configuration. ---
  # Namespace holding the plain, imperatively-provisioned source Secret
  # the SecretStore's "kubernetes" provider reads from
  # (lab/eso/provision-source-secret.sh) - never the same namespace as
  # this release's own namespace.
  sourceNamespace: ""
  # Name of that source Secret.
  sourceSecretName: ""
  # Key inside the source Secret's data to read.
  sourceProperty: "message"
  # Dedicated ServiceAccount (also rendered by templates/secretstore.yaml)
  # the SecretStore authenticates as - deliberately not this workload's
  # own ServiceAccount or the ESO controller's.
  authServiceAccountName: ""
  refreshInterval: "1m"
  # Key inside the generated target Secret to project as a file.
  key: "message"
  mountPath: "/etc/secret"
  fileName: "message"
  defaultMode: 0440

# Phase 2.8.1 (ADR-0006 amendment): graceful shutdown. On termination
# Kubernetes removes the pod from the Service's endpoints in parallel with
# running preStop - the native `sleep` preStop action (no shell needed in
# the image) keeps the pod serving while that removal propagates, then
# SIGTERM lets the server drain in-flight requests for up to
# serverShutdownTimeoutSeconds. The template fails the render unless
# preStopSleepSeconds + serverShutdownTimeoutSeconds + 5 <=
# terminationGracePeriodSeconds.
gracefulShutdown:
  preStopSleepSeconds: 5
  serverShutdownTimeoutSeconds: 5

# Phase 2.8.1: rendered only when replicaCount >= 2 - with a single
# replica a budget protects nothing, and a minAvailable-style budget
# would block every drain forever. maxUnavailable keeps one eviction
# always possible.
podDisruptionBudget:
  maxUnavailable: 1

# Phase 2.8.1: spread replicas across nodes and zones. ScheduleAnyway by
# default so a single-node lab (or a cluster without zone labels) still
# schedules; an overlay that knows its cluster has several zones sets
# zone to DoNotSchedule (values-prod-aws.yaml).
topologySpread:
  maxSkew: 1
  hostname: ScheduleAnyway
  zone: ScheduleAnyway

# Phase 2.8.1: one policy for this workload's own pods (Ingress and
# Egress). Ingress: only to the http port, only from pods in the same
# namespace plus any namespace listed in ingressFromNamespaces (matched
# by kubernetes.io/metadata.name). Egress: only DNS to kube-dns. The pod
# never talks to the API server (automountServiceAccountToken: false);
# ESO does that from its own namespace. Enforced by kind's kindnetd
# (measured, Phase 2.8 plan); disabled in the aws overlays until the EKS
# VPC CNI has network policy enabled (TAD R-14).
networkPolicy:
  enabled: true
  ingressFromNamespaces: []

# Phase 2.8.2 (ADR-0006 amendment): HorizontalPodAutoscaler on CPU
# utilization (needs metrics-server on the cluster - installed per
# workload cluster by lab/metrics-server/install.sh). When enabled, the
# Deployment does NOT render spec.replicas - the HPA owns it - and the
# PodDisruptionBudget follows minReplicas instead of replicaCount. Argo
# CD ignores /spec/replicas on Deployments (gitops/bootstrap) so it never
# fights the HPA. Off by default; on in values-prod.yaml only, and off in
# the aws overlays until EKS has metrics-server (TAD R-14).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300

podAnnotations: {}
podLabels: {}
