# Environment overrides for uat only. Everything not listed here is
# inherited from values.yaml. Commit 2 of the Phase 2.4 implementation
# changes only configMap.uiMessage below, to a "final" value, as the
# GitOps rollout proof (see docs/adr/0008-standard-workload-before-sso.md
# and the Phase 2.4 plan's rollout-test section).
replicaCount: 1

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

configMap:
  uiMessage: "podinfo uat — phase 2.4 verified"

# Phase 2.6.2: enables the read-only Secret mount for uat only.
externalSecret:
  enabled: true
  secretStoreName: "uat-kubernetes-backend"
  sourceNamespace: "eso-source-uat"
  sourceSecretName: "local-backend-uat"
  authServiceAccountName: "uat-secretstore-reader"
