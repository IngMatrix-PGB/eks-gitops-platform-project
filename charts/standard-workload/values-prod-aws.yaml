# aws-eks profile overlay for prod (Phase 3.3.2; renamed and extended
# to dev/uat/prod in Phase 2.7.2, ADR-0015). Consumed only by the
# aws-eks profile of gitops/bootstrap (DESIGNED / NOT DEPLOYED). This
# file is a statically validated, offline-only fixture proving the
# chart's provider: aws contract renders correctly for prod's own
# identity - it does not create, and cannot create, any AWS resource.
#
# Everything except externalSecret mirrors values-prod.yaml exactly -
# only the secret backend changes, never the workload itself.
# Phase 5.1c-1: this environment's image, changed only by `make promote`
# (scripts/promote/promote.sh). values-prod.yaml and values-prod-aws.yaml
# always hold the same reference; check-promotion enforces it.
image:
  repository: ghcr.io/stefanprodan/podinfo
  digest: "sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

configMap:
  uiMessage: "podinfo prod — aws-eks profile (not deployed)"

# aws.region/aws.secretName below are cross-validated (scripts/validate/
# check-standard-workload-chart.sh) against terraform/envs/identity:
# variables.tf's aws_region validation shape and environments.tf's prod
# secret_name (Phase 3.4.3c) - never hand-invented, never an ARN, never
# an account ID.
# sourceNamespace/sourceSecretName/sourceProperty/authServiceAccountName
# are deliberately absent here (not "set to empty") - they inherit their
# harmless kubernetes-only default from the chart's own values.yaml,
# which is what values.schema.json's provider: aws branch requires.
externalSecret:
  enabled: true
  provider: "aws"
  secretStoreName: "prod-aws-backend"
  aws:
    region: "us-east-1"
    secretName: "eks-gitops-platform-project/prod/backend"

# Phase 3.4.3a closes TAD R-14: terraform/envs/eks runs the VPC CNI add-on
# with enableNetworkPolicy, so the policy is enforced on EKS too.
networkPolicy:
  enabled: true

# Phase 2.8.1: EKS nodes carry topology.kubernetes.io/zone and prod runs
# across several zones - two prod replicas must never share one.
topologySpread:
  maxSkew: 1
  hostname: ScheduleAnyway
  zone: DoNotSchedule

# Phase 3.4.3a: metrics-server runs as an EKS add-on (terraform/envs/eks),
# so prod-aws scales like prod (chart default 300s scale-down window). A
# first deploy creates the Deployment, so no replicas hand-over is needed;
# moving an already-running static prod-aws under the HPA needs
# `make workload-hpa-handover` first (ADR-0006 amendment, Phase 2.8.2).
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 300
