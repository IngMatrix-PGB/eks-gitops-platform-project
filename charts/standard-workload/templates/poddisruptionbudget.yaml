{{- /*
Phase 2.8.1: only with two or more replicas - a budget on a single
replica protects nothing, and maxUnavailable (never minAvailable) keeps
one voluntary eviction always possible.
*/ -}}
{{- /* Phase 2.8.2: with an HPA, the floor is minReplicas, not replicaCount. */ -}}
{{- $floor := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
{{- if ge (int $floor) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "standard-workload.fullname" . }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "standard-workload.selectorLabels" . | nindent 6 }}
{{- end }}
