{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "standard-workload.fullname" . }}-secret
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: SecretStore
    name: {{ .Values.externalSecret.secretStoreName }}
  target:
    name: {{ include "standard-workload.fullname" . }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.externalSecret.key }}
      remoteRef:
        {{- /*
        Phase 3.3.1: the only provider-specific line in this file - the
        remote key is the source K8s Secret name (kubernetes provider)
        or the Secrets Manager secret's logical name (aws provider,
        never an ARN - see .local/evidence/phase-3.3-...-plan.md
        Section 7). Everything else in this file (kind, target,
        creationPolicy, deletionPolicy, secretKey) is identical for
        both providers.
        */}}
        {{- if eq .Values.externalSecret.provider "aws" }}
        key: {{ .Values.externalSecret.aws.secretName }}
        {{- else }}
        key: {{ .Values.externalSecret.sourceSecretName }}
        property: {{ .Values.externalSecret.sourceProperty }}
        {{- end }}
{{- end }}
