apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "standard-workload.fullname" . }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "standard-workload.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "standard-workload.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "standard-workload.fullname" . }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.podSecurityContext.fsGroupChangePolicy }}
        seccompProfile:
          type: {{ .Values.podSecurityContext.seccompProfile.type }}
      containers:
        - name: {{ include "standard-workload.name" . }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.containerSecurityContext.capabilities.drop | nindent 16 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "standard-workload.fullname" . }}-config
                  key: ui-message
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- if .Values.volumes.dataEmptyDir }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.volumes.tmpEmptyDir }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            - name: secret
              mountPath: {{ .Values.externalSecret.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.volumes.dataEmptyDir }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.volumes.tmpEmptyDir }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.externalSecret.enabled }}
        - name: secret
          secret:
            secretName: {{ include "standard-workload.fullname" . }}-secret
            defaultMode: {{ .Values.externalSecret.defaultMode }}
            items:
              - key: {{ .Values.externalSecret.key }}
                path: {{ .Values.externalSecret.fileName }}
            optional: false
        {{- end }}
