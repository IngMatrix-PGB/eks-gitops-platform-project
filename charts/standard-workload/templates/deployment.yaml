{{- $gs := .Values.gracefulShutdown }}
{{- $as := .Values.autoscaling }}
{{- if and $as.enabled (lt (int $as.maxReplicas) (int $as.minReplicas)) }}
{{- fail (printf "standard-workload: autoscaling.maxReplicas (%d) must be >= minReplicas (%d)" (int $as.maxReplicas) (int $as.minReplicas)) }}
{{- end }}
{{- if and .Values.metrics.enabled (eq (int .Values.metrics.port) (int .Values.service.port)) }}
{{- fail (printf "standard-workload: metrics.port (%d) must differ from service.port" (int .Values.metrics.port)) }}
{{- end }}
{{- if gt (add $gs.preStopSleepSeconds $gs.serverShutdownTimeoutSeconds 5) (int .Values.terminationGracePeriodSeconds) }}
{{- fail (printf "standard-workload: gracefulShutdown.preStopSleepSeconds (%d) + serverShutdownTimeoutSeconds (%d) + 5 must not exceed terminationGracePeriodSeconds (%d)" (int $gs.preStopSleepSeconds) (int $gs.serverShutdownTimeoutSeconds) (int .Values.terminationGracePeriodSeconds)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "standard-workload.fullname" . }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
  {{- if $as.enabled }}
  annotations:
    # Phase 2.8.2: tells Argo CD (gitops/bootstrap ignoreDifferences) that
    # the HPA, not Git, owns spec.replicas of this Deployment.
    eks-gitops-lab-lite.local/replicas-owner: hpa
  {{- end }}
spec:
  {{- /*
  Phase 2.8.2: with an HPA, render its minReplicas instead of omitting
  the field. Omitting it was measured to drop prod to 1 replica on the
  hand-over sync: server-side apply removes a field its manager stops
  sending and the API default (1) applies. Rendering minReplicas keeps
  Argo CD the field's manager; on every later sync RespectIgnoreDifferences
  (gitops/bootstrap, Deployments annotated replicas-owner=hpa) replaces
  it with the live value the HPA chose, so Argo CD never fights the HPA.
  */}}
  replicas: {{ ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.strategy.type }}
    rollingUpdate:
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
      maxSurge: {{ .Values.strategy.maxSurge }}
  selector:
    matchLabels:
      {{- include "standard-workload.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "standard-workload.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.topologySpread.hostname }}
          labelSelector:
            matchLabels:
              {{- include "standard-workload.selectorLabels" . | nindent 14 }}
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.zone }}
          labelSelector:
            matchLabels:
              {{- include "standard-workload.selectorLabels" . | nindent 14 }}
      serviceAccountName: {{ include "standard-workload.fullname" . }}
      securityContext:
        runAsNonRoot: {{ .Values.podSecurityContext.runAsNonRoot }}
        runAsUser: {{ .Values.podSecurityContext.runAsUser }}
        runAsGroup: {{ .Values.podSecurityContext.runAsGroup }}
        fsGroup: {{ .Values.podSecurityContext.fsGroup }}
        fsGroupChangePolicy: {{ .Values.podSecurityContext.fsGroupChangePolicy }}
        seccompProfile:
          type: {{ .Values.podSecurityContext.seccompProfile.type }}
      containers:
        - name: {{ include "standard-workload.name" . }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          securityContext:
            allowPrivilegeEscalation: {{ .Values.containerSecurityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.containerSecurityContext.readOnlyRootFilesystem }}
            capabilities:
              drop:
                {{- toYaml .Values.containerSecurityContext.capabilities.drop | nindent 16 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            - name: UI_MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ include "standard-workload.fullname" . }}-config
                  key: ui-message
            - name: SHUTDOWN_TIMEOUT
              value: "{{ $gs.serverShutdownTimeoutSeconds }}s"
            {{- if .Values.metrics.enabled }}
            - name: METRICS_PORT
              value: "{{ .Values.metrics.port }}"
            {{- end }}
            {{- /* Phase 6.3b (ADR-0023): plain, non-secret settings (a
            peer service's URL, a database host). Secrets never travel
            here - the schema rejects secret-like names, and they reach a
            workload only as ESO-built files. */}}
            {{- range $name, $value := .Values.extraEnv }}
            {{- if has $name (list "UI_MESSAGE" "SHUTDOWN_TIMEOUT" "METRICS_PORT") }}
            {{- fail (printf "extraEnv: %s is set by the chart itself" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $gs.preStopSleepSeconds }}
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.path }}
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.path }}
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            {{- if .Values.volumes.dataEmptyDir }}
            - name: data
              mountPath: /data
            {{- end }}
            {{- if .Values.volumes.tmpEmptyDir }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- if .Values.externalSecret.enabled }}
            - name: secret
              mountPath: {{ .Values.externalSecret.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.volumes.dataEmptyDir }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.volumes.tmpEmptyDir }}
        - name: tmp
          emptyDir: {}
        {{- end }}
        {{- if .Values.externalSecret.enabled }}
        - name: secret
          secret:
            secretName: {{ include "standard-workload.fullname" . }}-secret
            defaultMode: {{ .Values.externalSecret.defaultMode }}
            items:
              - key: {{ .Values.externalSecret.key }}
                path: {{ .Values.externalSecret.fileName }}
            optional: false
        {{- end }}
