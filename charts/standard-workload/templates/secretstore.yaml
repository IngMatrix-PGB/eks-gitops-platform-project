{{- if .Values.externalSecret.enabled }}
{{- if eq .Values.externalSecret.provider "kubernetes" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecret.authServiceAccountName }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.externalSecret.sourceNamespace }}
      server:
        url: "kubernetes.default"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.externalSecret.authServiceAccountName }}
          namespace: {{ .Release.Namespace }}
{{- else if eq .Values.externalSecret.provider "aws" }}
{{- /*
Phase 3.3.1: EKS Pod Identity contract (schema/template only - not
deployed, no AWS account exists). No ServiceAccount is rendered here:
unlike the "kubernetes" provider above, Pod Identity authenticates the
ESO controller's OWN pod (via the Pod Identity Association Terraform
creates - terraform/modules/eso-identity - never a per-SecretStore
identity). Deliberately no `auth` block and no `serviceAccountRef`: per
External Secrets Operator's own documentation (verified against
https://external-secrets.io/latest/provider/aws-access/, 2026-09-09),
"No auth section is defined for the SecretStore" for EKS Pod Identity,
and serviceAccountRef "cannot be used together with EKS Pod Identity"
(ESO "can not impersonate service accounts which have iam roles bound
using pod identity" - fails with "unable to create session: an IAM role
must be associated with service account ..."). No `role`, no
`externalID`, no static AWS keys - none of these are part of this
contract at all.
*/}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.externalSecret.secretStoreName }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.aws.region }}
{{- end }}
{{- end }}
