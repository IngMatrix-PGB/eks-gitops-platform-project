{{- /*
Phase 2.8.1: this workload's own pods only (podSelector = selectorLabels).
Listing both policy types makes anything not allowed below denied.
Ingress: the http port, from pods in this namespace and from any
namespace named in networkPolicy.ingressFromNamespaces. Egress: DNS to
kube-dns only.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "standard-workload.fullname" . }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "standard-workload.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
