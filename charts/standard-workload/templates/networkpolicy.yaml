{{- /*
Phase 2.8.1: this workload's own pods only (podSelector = selectorLabels).
Listing both policy types makes anything not allowed below denied.
Ingress: the http port, from pods in this namespace and from any
namespace named in networkPolicy.ingressFromNamespaces; Phase 6.1a: the
metrics port, only from the namespaces in metrics.scrapeFromNamespaces.
Egress: DNS to kube-dns only; Phase 6.3b: plus each networkPolicy.
egressToPods entry (pods of this namespace, by labels, one TCP port).
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "standard-workload.fullname" . }}
  labels:
    {{- include "standard-workload.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "standard-workload.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
    {{- if and .Values.metrics.enabled .Values.metrics.scrapeFromNamespaces }}
    - from:
        {{- range .Values.metrics.scrapeFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.networkPolicy.egressToPods }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
{{- end }}
