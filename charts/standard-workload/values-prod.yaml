# Environment overrides for prod only. Everything not listed here
# is inherited from values.yaml. This file is never touched by the
# Phase 2.4 rollout-verification commit - its stability across that
# change is the isolation proof.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

configMap:
  uiMessage: "podinfo prod — phase 2.4"

# Phase 2.6.2: enables the read-only Secret mount for prod only -
# fully separate SecretStore/source-namespace/source-Secret/auth
# ServiceAccount from uat, no shared object of any kind.
externalSecret:
  enabled: true
  secretStoreName: "prod-kubernetes-backend"
  sourceNamespace: "eso-source-prod"
  sourceSecretName: "local-backend-prod"
  authServiceAccountName: "prod-secretstore-reader"

# Phase 2.8.2: prod scales on CPU between 2 and 4 replicas (replicaCount
# above is then not rendered - the HPA owns spec.replicas). The 60s
# scale-down window is a lab value so the autoscaling test stays short;
# the chart default is 300s.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 60
