# Environment overrides for prod only. Everything not listed here
# is inherited from values.yaml. This file is never touched by the
# Phase 2.4 rollout-verification commit - its stability across that
# change is the isolation proof.
# Phase 5.1c-1: this environment's image, changed only by `make promote`
# (scripts/promote/promote.sh). values-prod.yaml and values-prod-aws.yaml
# always hold the same reference; check-promotion enforces it.
image:
  repository: ghcr.io/ingmatrix-pgb/eks-gitops-platform-smoke
  digest: "sha256:146757533ef4f3fe2b003a888dfe70b9e5e616b1431aff37d2a17d2d3f1a7047"

replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

configMap:
  uiMessage: "platform smoke prod"

# Phase 2.6.2: enables the read-only Secret mount for prod only -
# fully separate SecretStore/source-namespace/source-Secret/auth
# ServiceAccount from uat, no shared object of any kind.
externalSecret:
  enabled: true
  secretStoreName: "prod-kubernetes-backend"
  sourceNamespace: "eso-source-prod"
  sourceSecretName: "local-backend-prod"
  authServiceAccountName: "prod-secretstore-reader"

# Phase 2.8.2: prod scales on CPU between 2 and 4 replicas (the
# Deployment renders minReplicas; the HPA owns the live value). The 60s
# scale-down window is a lab value so the autoscaling test stays short;
# the chart default is 300s.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  scaleDownStabilizationSeconds: 60

# Phase 6.3c (ADR-0023): /api/notes forwards to notes in this namespace
# (Application platform-notes-prod), and only notes is reachable beyond DNS.
# Lab only: the aws overlay keeps notes off until 6.4.
extraEnv:
  NOTES_URL: http://platform-notes-prod-standard-workload:8080

networkPolicy:
  egressToPods:
    - podLabels:
        app.kubernetes.io/instance: platform-notes-prod
      port: 8080
